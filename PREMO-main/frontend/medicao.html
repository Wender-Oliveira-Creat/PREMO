<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Medição</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body class="medicao">

    <div class="container">
        <div class="card">

            <!-- TOPO -->
            <div class="topo">
                <a href="index.html" class="voltar">
                    ←
                </a>
                <h2>Nova Medição</h2>
            </div>

            <!-- PRESSÃO -->
            <div class="pressao-container">

                <!-- ALTA -->
                <div class="pressao-box ativa" id="box-alta">
                    <span>ALTA</span>
                    <h1 id="valor-alta">0 <small>mmHg</small></h1>
                </div>

                <!-- BAIXA -->
                <div class="pressao-box" id="box-baixa">
                    <span>BAIXA</span>
                    <h1 id="valor-baixa">0 <small>mmHg</small></h1>
                </div>

            </div>

            <!-- TECLADO -->
            <div class="teclado">
                <button>1</button>
                <button>2</button>
                <button>3</button>

                <button>4</button>
                <button>5</button>
                <button>6</button>

                <button>7</button>
                <button>8</button>
                <button>9</button>

                <button>⌫</button>
                <button>0</button>
                <button>✔</button>
            </div>

            <!-- BOTÃO -->
            <button class="btn-salvar">
                Salvar Medição
            </button>

            <!-- TEXTO -->
            <p class="info">
                *Certifique-se de estar em repouso há pelo menos 5 minutos.
            </p>

            <!-- MENU -->
            <div class="menu">
                <span>Inicio</span>
                <span>Relatorios</span>
                <span class="ativo">Medir</span>
                <span>Perfil</span>
            </div>

        </div>
    </div>

    <!-- JS -->
    <script src="script.js"></script>

</body>

</html>
