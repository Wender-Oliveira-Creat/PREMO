<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta - PREMO</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Ícones -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="login">

    <div class="container">

        <div class="card cadastro-card">

            <!-- BOTÃO VOLTAR -->
            <a href="index.html" class="voltar">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <!-- LOGO -->
            <img src="imglogopremo.png" alt="PREMO" class="logo">

            <h1>Criar Conta</h1>

            <p>
                Cadastre-se para começar
                a monitorar sua saúde.
            </p>

            <!-- NOME -->
            <div class="input-group">
                <label>NOME COMPLETO</label>

                <div class="input-box">
                    <i class="fa-regular fa-user"></i>

                    <input
                        type="text"
                        placeholder="Digite seu nome"
                    >
                </div>
            </div>

            <!-- EMAIL -->
            <div class="input-group">
                <label>EMAIL</label>

                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        placeholder="exemplo@email.com"
                    >
                </div>
            </div>

            <!-- SENHA -->
            <div class="input-group">
                <label>SENHA</label>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        placeholder="••••••••"
                    >
                </div>
            </div>

            <!-- CONFIRMAR SENHA -->
            <div class="input-group">
                <label>CONFIRMAR SENHA</label>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        placeholder="••••••••"
                    >
                </div>
            </div>

            <!-- BOTÃO -->
            <a href="medicao.html" class="btn-login">
                Criar Conta
            </a>

            <!-- LINK LOGIN -->
            <p class="signup-text">
                Já possui uma conta?
            </p>

            <a href="index.html" class="signup-link">
                Fazer login
            </a>

        </div>

    </div>

</body>
</html>
