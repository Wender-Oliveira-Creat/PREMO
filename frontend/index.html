<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREMO Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Ícones -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
</head>

<body class="login">

    <div class="container">

        <div class="card">

            <img src="imglogopremo.png" alt="PREMO" class="logo">

            <h1>Bem-vindo ao PREMO</h1>

            <p>
                Sua saúde está em boas mãos.
                Entre para monitorar sua pressão arterial.
            </p>

            <!-- EMAIL -->
            <div class="input-group">
                <label>EMAIL</label>

                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>

                    <input
                        type="email"
                        placeholder="exemplo@email.com"
                    >
                </div>
            </div>

            <!-- SENHA -->
            <div class="input-group">
                <label>SENHA</label>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="senha"
                        placeholder="••••••••"
                    >

                    <i class="fa-regular fa-eye eye" id="toggle"></i>
                </div>
            </div>

            <!-- BOTÃO -->
            <a href="medicao.html" class="btn-login">
                Entrar
            </a>

            <p class="signup-text">
                Ainda não tem uma conta?
            </p>

            <a href="#" class="signup-link">
                Criar conta
            </a>

        </div>

    </div>

</body>
</html>
