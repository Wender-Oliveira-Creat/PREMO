<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREMO login</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
    <div class="login-card">

      <img src="imglogopremo.png" alt="PREMO" class="logo">
      <h1>PREMO</h1>
      <h2>Bem vindo ao PREMO</h2>

    <p>
      Sua saúde está em boas mãos. Entre para monitorar sua pressão arterial.
    </p>

       <!-- EMAIL -->
      <form>
        <label>EMAIL</label>
        <input type="email" placeholder="exemplo@email.com" />
        <button type="submit">Entrar</button>
      </form>
    </div>
  </div>

       <!-- SENHA -->
         <div class="input-group">
          <label>SENHA</label>
         <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="senha" placeholder="............">
          <i class="fa-regular fa-eye eye" id="toggle"></i>
             </form>
              <h1>Ainda não tem uma conta?</h1>
                <a href="#">Criar conta</a>
          </div>
         </div>
</body>
</html>
