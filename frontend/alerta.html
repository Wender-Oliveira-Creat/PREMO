<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alerta</title>

    <!-- Tailwind (mantém porque seu layout depende dele) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-[#f6fafa] flex justify-center">

<div class="w-full max-w-[420px] min-h-screen pb-20">

    <!-- HEADER -->
    <header class="sticky top-0 bg-white shadow-sm p-4 flex justify-between items-center">
        <h1 id="titulo-header" class="font-bold text-red-600">⚠ Alerta</h1>
        <span>👤</span>
    </header>

    <!-- MAIN -->
    <main class="p-4 text-center space-y-4">

        <div class="text-5xl animate-pulse text-[#fe6332]">⚠</div>

        <!-- TÍTULO DINÂMICO -->
        <h2 id="titulo" class="font-black text-xl">
            Carregando...
        </h2>

        <!-- VALOR DINÂMICO -->
        <div class="bg-white p-5 rounded-xl shadow border-l-4 border-[#fe6332]">
            <p class="text-xs font-bold">Leitura Atual</p>
            <h1 id="valor" class="text-5xl font-black text-[#002f4b]">0/0</h1>
            <span class="text-lg">mmHg</span>
        </div>

        <!-- MENSAGEM DINÂMICA -->
        <div id="mensagem-box" class="bg-gray-100 p-3 rounded-xl font-semibold">
            Carregando...
        </div>

        <!-- DICAS -->
        <div class="space-y-3">

            <div class="bg-white p-4 rounded-xl shadow text-left">
                <h3 class="font-bold">Respire Fundo</h3>
                <p class="text-sm text-gray-600">Tente relaxar</p>
            </div>

            <div class="bg-white p-4 rounded-xl shadow text-left">
                <h3 class="font-bold">Fique em Repouso</h3>
                <p class="text-sm text-gray-600">Evite esforço</p>
            </div>

        </div>

        <button class="w-full p-4 bg-gradient-to-r from-[#002f4b] to-[#01466c] text-white rounded-xl font-bold shadow">
            📞 Ajuda está a caminho
        </button>

    </main>

    <!-- NAV -->
    <nav class="fixed bottom-0 w-full max-w-[420px] bg-white flex justify-around p-3 border-t">

        <a href="relatorio.html" class="flex flex-col items-center text-gray-500">
            📊
            <span class="text-[10px]">Relatórios</span>
        </a>

        <a href="alerta.html" class="flex flex-col items-center text-[#002f4b] font-bold">
            ⚠
            <span class="text-[10px]">Alerta</span>
        </a>

        <div class="flex flex-col items-center text-gray-400">
            🕒
            <span class="text-[10px]">Histórico</span>
            <span class="text-[8px]">em breve</span>
        </div>

        <div class="flex flex-col items-center text-gray-400">
            ⚙
            <span class="text-[10px]">Ajustes</span>
            <span class="text-[8px]">em breve</span>
        </div>

    </nav>

</div>

<!-- JS -->
<script src="js/alerta.js"></script>

</body>
</html>
