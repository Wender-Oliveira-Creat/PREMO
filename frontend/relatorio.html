<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="relatorio.css">
    <title>Relatorios</title>
</head>
<body>


    <div>
        <header>Relatorios</header>
    </div>
    

    <div class="caixa-mae-abas">
        <button class="botao-aba-ativo">7 DIAS</button>
        <button class="botao-aba">30 DIAS</button>
        <button class="botao-aba">TUDO</button>
    </div>


    <div class="medicao">


        <div class="card alta"> 
            <span class="nivel">ALTA</span>
            <span class="numero">125</span>
            <span class="medicao-unidade">mmHg</span>
        </div>


        <div class="card baixa">
            <span class="nivel">BAIXA</span>
            <span class="numero">82</span>
            <span class="mediacao-unidade">mmHg</span>
        </div>


    </div> <div class="historico">


        <div class="linha-historico status-normal">
            <span class="historico-data">17 Mai, 08:30</span> 
            <span class="historico-valor">120/80</span> 
            <span class="historico-status">NORMAL</span> 
        </div>

        
    </div>

</body>
</html>
