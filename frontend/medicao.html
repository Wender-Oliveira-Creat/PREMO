<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nova Medição</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="medicao">

<div class="container">
<div class="card">

    <!-- TOPO -->
    <div class="topo">
        <a href="index.html" class="bvoltar">←</a>
        <h2>Nova Medição</h2>
    </div>

    <!-- PRESSÃO -->
    <div class="pressao-container">

        <div class="pressao-box ativa" id="box-alta">
            <span>ALTA</span>
            <h1 id="valor-alta">0 <small>mmHg</small></h1>
        </div>

        <div class="pressao-box" id="box-baixa">
            <span>BAIXA</span>
            <h1 id="valor-baixa">0 <small>mmHg</small></h1>
        </div>

    </div>

    <!-- TECLADO -->
    <div class="teclado">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <button>⌫</button><button>0</button><button>✔</button>
    </div>

    <button class="btn-salvar">Salvar Medição</button>

    <p class="info">Fique em repouso por 5 minutos.</p>

    <!-- MENU -->
    <div class="menu">
        <a href="index.html" class="navegacao">Início</a>
        <a href="relatorio.html" class="navegacao">Relatório</a>
        <span class="ativo">Medir</span>
        <a href="alerta.html" class="navegacao">Alerta</a>
    </div>

</div>
</div>

<script src="medicao.js"></script>

</body>
</html>
